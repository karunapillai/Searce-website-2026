name: Deploy review preview to GitHub Pages

on:
  push:
    branches: [claude/searce-visual-language-6yl7k1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let the newest win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        # No enablement flag: the workflow GITHUB_TOKEN cannot create a
        # Pages site ("Resource not accessible by integration"). Pages
        # must be switched on once in Settings -> Pages with the source
        # set to "GitHub Actions"; after that this workflow deploys on
        # every push to this branch.
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
