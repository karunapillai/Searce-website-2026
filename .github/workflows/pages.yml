name: Publish review preview

# GitHub Pages for this repo is served from the gh-pages branch, which
# was created (and auto-enabled Pages) rather than switched to the
# "GitHub Actions" source. actions/deploy-pages only works with the
# latter, and the workflow GITHUB_TOKEN cannot change the source, so
# this job just mirrors the branch onto gh-pages instead.

on:
  push:
    branches:
      - claude/searce-visual-language-6yl7k1
      - claude/who-we-are-page-layout-b6rp6d
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Mirror onto gh-pages
        # gh-pages is a publishing branch only — nobody works on it —
        # so overwriting it with the current tree is safe.
        run: git push --force origin HEAD:refs/heads/gh-pages
