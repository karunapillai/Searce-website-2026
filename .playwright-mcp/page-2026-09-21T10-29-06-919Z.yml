          - heading [level=2] [ref=f6e49]:
            - text: Most enterprises bought the licences. Far fewer can say what work is
            - emphasis [ref=f6e50]: now done differently
            - text: .
          - generic [ref=f6e51]:
            - paragraph [ref=f6e52]: The pilots ran. The programme was announced. But which work is now done differently, by whom, and what was it worth? That gap is not a training problem. It is an engineering and measurement problem, and it is where the return on the entire AI investment is won or lost.
            - paragraph [ref=f6e53]: Searce measures adoption as tasks now done differently rather than as logins or licences issued, which puts adoption on the same metric ladder as the process itself. Where people revert to the old way, Searce fixes the workflow rather than the person, because most adoption failure is design failure.
