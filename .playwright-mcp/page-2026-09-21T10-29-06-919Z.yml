        - heading "Offerings" [level=2] [ref=f6e86]
        - generic [ref=f6e87]:
          - generic [ref=f6e88]:
            - button "01 AI value realisation" [expanded] [ref=f6e89] [cursor=pointer]:
              - generic [ref=f6e90]: "01"
              - generic [ref=f6e91]: AI value realisation
            - paragraph [ref=f6e94]: Turning AI spend into an accountable number. Baseline the work before the programme starts, then read hours returned, cycle time, quality and capacity against it.
          - generic [ref=f6e95]:
            - button "02 Workplace AI deployment and activation" [ref=f6e96] [cursor=pointer]:
              - generic [ref=f6e97]: "02"
              - generic [ref=f6e98]: Workplace AI deployment and activation
            - paragraph [ref=f6e101]: The workplace AI layer, including Gemini Enterprise, Google Workspace, Claude and adjacent assistants, deployed, activated and governed around the redesigned work rather than the vendor's default template.
          - generic [ref=f6e102]:
            - button "03 Seat utilisation and licence recovery" [ref=f6e103] [cursor=pointer]:
              - generic [ref=f6e104]: "03"
              - generic [ref=f6e105]: Seat utilisation and licence recovery
            - paragraph [ref=f6e108]: See which seats are earning their keep and which are quietly idle. Recover, redeploy or retire, and defend the renewal on evidence, not sentiment.
          - generic [ref=f6e109]:
            - button "04 Role and work redesign" [ref=f6e110] [cursor=pointer]:
              - generic [ref=f6e111]: "04"
              - generic [ref=f6e112]: Role and work redesign
            - paragraph [ref=f6e115]: Redesign the role and the workflow around what the system now does. Where people revert to the old way, the workflow is fixed rather than the person.
          - generic [ref=f6e116]:
            - button "05 AI capability building" [ref=f6e117] [cursor=pointer]:
              - generic [ref=f6e118]: "05"
              - generic [ref=f6e119]: AI capability building
            - paragraph [ref=f6e122]: Capability built in cohorts that can teach the next cohort, across role, function and seniority, including the people who will never write a prompt.
          - generic [ref=f6e123]:
            - button "06 Agent enablement for business teams" [ref=f6e124] [cursor=pointer]:
              - generic [ref=f6e125]: "06"
              - generic [ref=f6e126]: Agent enablement for business teams
            - paragraph [ref=f6e129]: Business teams building and operating their own agents inside the working day, with approved patterns, guardrails and a clean handback at the moment a person is genuinely needed.
          - generic [ref=f6e130]:
            - button "07 Adoption engineering" [ref=f6e131] [cursor=pointer]:
              - generic [ref=f6e132]: "07"
              - generic [ref=f6e133]: Adoption engineering
            - paragraph [ref=f6e136]: Adoption built as a system, with owners, instrumentation and gates. Measured as tasks now done differently, not as logins or licences issued.
          - generic [ref=f6e137]:
            - button "08 Knowledge and context enablement" [ref=f6e138] [cursor=pointer]:
              - generic [ref=f6e139]: "08"
              - generic [ref=f6e140]: Knowledge and context enablement
            - paragraph [ref=f6e143]: The retrieval and context layer that people and agents both read from. Governed, current and answerable, so the answer is the same whoever asks it.
