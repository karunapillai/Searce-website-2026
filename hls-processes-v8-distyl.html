<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V8 · Stage Carousel — HLS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#fff;--ink-80:rgba(255,255,255,0.86);--ink-60:rgba(255,255,255,0.65);--ink-40:rgba(255,255,255,0.42);--ink-20:rgba(255,255,255,0.18);
  --paper:#050a1e;--paper-2:#0a1230;--paper-side:#0e1636;--line:rgba(255,255,255,0.10);
  --blue:#0064ff;--blue-lit:#7ba9ff;--blue-strong:#b3d0ff;--blue-deep:#00337f;--blue-06:rgba(123,169,255,0.08);--blue-12:rgba(123,169,255,0.16);--blue-24:rgba(179,208,255,0.32);
  --dark:#02061a;--dark-2:#0a1230;--dark-line:rgba(179,208,255,0.18);--dark-ink:#f2f7ff;--dark-ink-60:#a9b3c9;
  --amber:#ffd582;
  --display:'Poppins',system-ui,sans-serif;
  --body:system-ui,'Segoe UI',Roboto,sans-serif;
}
[data-theme="light"]{
  --ink:#000;--ink-80:#1a1a1c;--ink-60:#54555a;--ink-40:#84868c;--ink-20:#c9d0e0;
  --paper:#fff;--paper-2:#f6f7f9;--paper-side:#f2f7ff;--line:#e4e6ea;
  --blue:#0064ff;--blue-lit:#0064ff;--blue-strong:#004ecc;--blue-deep:#00337f;
  --blue-06:#eef4ff;--blue-12:#dbe9ff;--blue-24:#b3d0ff;
  --amber:#8a5a10;
}

/* Theme toggle — fixed top right */
.theme-toggle{position:fixed;top:14px;right:20px;z-index:100;display:inline-flex;align-items:center;gap:6px;padding:6px;border:1px solid var(--line);border-radius:999px;background:var(--paper-2);}
.theme-toggle button{width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--ink-60);transition:all .18s;}
.theme-toggle button svg{width:15px;height:15px;}
.theme-toggle button.on{background:var(--blue);color:#fff;}
[data-theme="light"] .theme-toggle button.on{background:var(--ink);color:#fff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.55;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;background:none;border:none;cursor:pointer;color:inherit;}
.wrap{max-width:1360px;margin:0 auto;padding:0 40px;}

.crumb{background:var(--paper-2);border-bottom:1px solid var(--line);padding:16px 0;font-size:13px;color:var(--ink-60);}
.crumb a{color:var(--blue-lit);}
.crumb strong{color:var(--ink);font-weight:500;margin-left:8px;}

.section{padding:72px 0 100px;background:var(--paper);}
.eyebrow{font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--blue-lit);}
h2{font-family:var(--display);font-weight:300;font-size:clamp(30px,3.4vw,46px);line-height:1.05;letter-spacing:-0.02em;margin:14px 0 8px;max-width:900px;color:var(--ink);}
.sub{color:var(--ink-60);max-width:640px;font-size:15.5px;margin-bottom:40px;}

/* Process picker — V7 pill style */
.p-tabs-wrap{display:flex;justify-content:center;margin-bottom:80px;}
.p-tabs{display:inline-flex;gap:2px;background:rgba(255,255,255,0.06);padding:5px;border-radius:999px;flex-wrap:wrap;justify-content:center;border:1px solid var(--line);}
[data-theme="light"] .p-tabs{background:#e8e8ed;border-color:transparent;}
.p-tab{padding:10px 22px;font-family:var(--display);font-weight:500;font-size:14px;color:var(--ink-60);border-radius:999px;transition:all .18s;white-space:nowrap;letter-spacing:-0.005em;}
.p-tab:hover{color:var(--ink);}
.p-tab.active{background:var(--blue);color:#fff;}
[data-theme="light"] .p-tab.active{background:var(--ink);}

/* Stage strip */
.stage-strip{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:44px;}
.stage-item{padding:18px 20px;flex:1;min-width:130px;cursor:pointer;text-align:left;transition:all .2s;position:relative;color:var(--ink-40);border-right:1px solid var(--line);}
.stage-item:last-child{border-right:none;}
.stage-item:hover{background:rgba(255,255,255,0.03);}
.stage-item .num{font-family:var(--display);font-weight:500;font-size:10.5px;letter-spacing:.22em;color:var(--ink-40);text-transform:uppercase;transition:color .2s;}
.stage-item .name{font-family:var(--display);font-weight:400;font-size:14px;color:var(--ink-60);margin-top:6px;line-height:1.25;letter-spacing:-0.005em;transition:color .2s;}
.stage-item:hover .name{color:var(--ink);}
.stage-item.active .num{color:var(--blue-lit);font-weight:500;}
.stage-item.active .name{color:var(--ink);font-weight:500;}
.stage-item.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--blue-lit);}

/* 3D Scroll Carousel — cards arranged around a circle in 3D space */
.carousel{position:relative;margin:0 auto 56px;max-width:1200px;height:385px;perspective:1500px;perspective-origin:50% 50%;}
.carousel-track{position:absolute;top:50%;left:50%;width:0;height:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.22,.61,.36,1);}
.slide{position:absolute;top:-159px;left:-158px;width:316px;height:318px;
  border-radius:14px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:var(--paper-side);border:1px solid var(--line);cursor:pointer;
  transform-origin:center center;backface-visibility:visible;
  transition:background .5s ease, border-color .5s ease, box-shadow .5s ease;}
.slide.pos-center{background:linear-gradient(160deg,#0a1c4a 0%,#050a1e 100%);border-color:rgba(179,208,255,0.22);box-shadow:0 30px 70px -24px rgba(0,0,0,0.7);cursor:default;}
.slide .stage-tag{position:absolute;top:18px;left:20px;font-family:var(--display);font-weight:500;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-40);transition:color .4s;}
.slide.pos-center .stage-tag{color:var(--blue-lit);}
.slide .stage-name{position:absolute;bottom:18px;left:20px;right:20px;font-family:var(--display);font-weight:400;font-size:13px;line-height:1.3;letter-spacing:-0.005em;color:var(--ink-60);transition:color .4s,font-weight .4s;}
.slide.pos-center .stage-name{color:var(--ink);font-weight:500;font-size:15px;}
.slide svg{position:absolute;width:64%;height:56%;top:22%;left:18%;transition:opacity .4s;}
.slide .svg-center{opacity:0;}
.slide .svg-side{opacity:0.78;}
[data-theme="light"] .slide .svg-side{opacity:0.72;}
.slide.pos-center .svg-center{opacity:1;}
.slide.pos-center .svg-side{opacity:0;}

/* Carousel arrow controls */
.car-controls{display:flex;justify-content:center;gap:14px;margin:0 auto 44px;}
.car-btn{width:42px;height:42px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;transition:all .18s;}
.car-btn:hover{background:var(--blue);border-color:var(--blue);color:#fff;}
.car-btn svg{width:16px;height:16px;}

/* Text block below */
.text-block{display:grid;grid-template-columns:1fr 1.4fr;gap:60px;padding-top:8px;max-width:1104px;margin:0 auto;}
.tb-left{display:flex;flex-direction:column;gap:14px;}
.tc-meta{display:flex;align-items:center;gap:12px;}
.tc-num{font-family:var(--display);font-weight:500;font-size:11px;letter-spacing:.22em;color:var(--ink-40);text-transform:uppercase;}
.tc-mode{font-family:var(--display);font-weight:500;font-size:10px;letter-spacing:.18em;text-transform:uppercase;padding:4px 11px;border-radius:6px;}
.tc-mode.autonomous{background:rgba(123,169,255,0.15);color:var(--blue-lit);}
.tc-mode.handoff{background:rgba(255,213,130,0.15);color:var(--amber);}
.tc-name{font-family:var(--display);font-weight:300;font-size:clamp(26px,2.8vw,36px);letter-spacing:-0.02em;line-height:1.1;color:var(--ink);}
.tc-what{color:var(--ink-60);font-size:16px;line-height:1.65;}

.tb-right{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line);}
.tc-fact{display:grid;grid-template-columns:110px 1fr;gap:20px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line);}
.tc-fact .lbl{font-family:var(--display);font-weight:500;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;}
.tc-fact.agent .lbl{color:var(--blue-lit);}
.tc-fact.human .lbl{color:var(--amber);}
.tc-fact.metric .lbl{color:#b48cff;}
[data-theme="light"] .tc-fact.metric .lbl{color:#734bff;}
.tc-fact .val{font-family:var(--display);font-weight:500;font-size:15px;color:var(--ink);letter-spacing:-0.005em;}
.tc-fact .val .desc{font-family:var(--body);font-weight:400;font-size:13.5px;color:var(--ink-60);margin-top:3px;}
.tc-fact.none .val{color:var(--ink-40);font-weight:400;}

@media (max-width:960px){
  .text-block{grid-template-columns:1fr;gap:24px;}
  .carousel-track{grid-template-columns:1fr;}
  .slide.side{display:none;}
  .stage-item{flex:1 0 auto;min-width:0;padding:14px 12px;}
  .stage-item .name{font-size:13px;}
}
</style>
</head>
<body>

<div class="theme-toggle" role="group" aria-label="Theme">
  <button id="tLight" aria-label="Light theme" title="Light">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>
  <button id="tDark" aria-label="Dark theme" title="Dark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</div>

<div class="crumb"><div class="wrap"><a href="hls-processes-storyboard.html">← Storyboard</a> <strong>Variation 08 · Stage Carousel</strong></div></div>

<section class="section">
  <div class="wrap">
    <div class="p-tabs-wrap"><div class="p-tabs" id="pTabs"></div></div>

    <div class="carousel">
      <div class="carousel-track" id="carTrack"></div>
    </div>
    <div class="car-controls">
      <button class="car-btn" id="carPrev" aria-label="Previous stage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="car-btn" id="carNext" aria-label="Next stage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <div class="text-block">
      <div class="tb-left" id="tbLeft"></div>
      <div class="tb-right" id="tbRight"></div>
    </div>
  </div>
</section>

<script>
const PROCESSES = [
  {
    name:"Medical Imaging & Diagnostic Analysis",
    stages:[
      {key:"lens",       name:"Image Acquisition",  what:"The study is captured on the modality with protocol matched to the clinical order and image quality verified before release.", agent:{role:"Protocol Agent",desc:"Verifies protocol and image quality."}, human:{role:"Technologist",desc:"Runs the scan."}, metric:"Repeat scan rate"},
      {key:"router",     name:"Ingestion & Routing", what:"DICOM series ingested to PACS and routed to the correct radiologist worklist by modality, urgency, and subspecialty.", agent:{role:"Routing Agent",desc:"Routes by modality, urgency, subspecialty."}, human:null, metric:"Ingestion latency"},
      {key:"reticle",    name:"Preliminary Detection", what:"AI reads the study for anomalies and prioritises the worklist before the radiologist opens it.", agent:{role:"Detection Agent",desc:"Flags nodules, hemorrhage, fractures."}, human:null, metric:"Priority triage accuracy"},
      {key:"stack",      name:"Radiologist Review", what:"The radiologist opens the study, confirms or overrides AI findings, with priors and measurements surfaced automatically.", agent:{role:"Comparison Agent",desc:"Surfaces priors and measurements."}, human:{role:"Radiologist",desc:"Owns interpretation."}, metric:"Read turnaround"},
      {key:"grid",       name:"Structured Reporting", what:"Draft report composed with findings, impression, and recommendations, formatted with lexicons like BI-RADS.", agent:{role:"Reporting Agent",desc:"Drafts structured report from dictation."}, human:null, metric:"Report completeness"},
      {key:"seal",       name:"Sign-off", what:"The radiologist reviews the draft and signs the final report. Sign-off remains human by policy.", agent:null, human:{role:"Radiologist",desc:"Signs the final report."}, metric:"Sign-off time"},
      {key:"beacon",     name:"Critical Findings", what:"Urgent findings escalated to the ordering clinician and tracked to acknowledgment, with escalation on delay.", agent:{role:"Notification Agent",desc:"Pages, tracks acknowledgment."}, human:{role:"Radiologist",desc:"Confirms the critical finding."}, metric:"Time to communication"}
    ]
  },
  {
    name:"Clinical Documentation",
    stages:[
      {key:"wave",       name:"Patient Encounter",   what:"Ambient capture of the clinician-patient conversation with on-device speaker separation.", agent:{role:"Capture Agent",desc:"On-device audio capture."}, human:{role:"Clinician",desc:"Conducts the encounter."}, metric:"Capture fidelity"},
      {key:"funnel",     name:"Clinical Extraction", what:"Symptoms, medications, and orders extracted from the transcript and linked to problem lists.", agent:{role:"Extraction Agent",desc:"Structures clinical entities."}, human:null, metric:"Recall"},
      {key:"lines",      name:"Note Generation",     what:"Draft SOAP note assembled in specialty-appropriate format, composed in the physician's voice.", agent:{role:"Scribe Agent",desc:"Composes the draft note."}, human:null, metric:"Draft usability"},
      {key:"cube",       name:"EHR Update",          what:"Note pushed to the EHR with orders, ICD-10, and CPT codes attached.", agent:{role:"EHR Agent",desc:"Writes to the EHR via FHIR."}, human:null, metric:"Post-visit lag"},
      {key:"check",      name:"Sign-off",            what:"Physician reviews, edits, and signs the final note.", agent:null, human:{role:"Physician",desc:"Owns the final note."}, metric:"Sign-off time"}
    ]
  },
  {
    name:"Clinical Trial Recruitment",
    stages:[
      {key:"book",       name:"Protocol Ingestion",  what:"Trial protocol parsed for inclusion and exclusion criteria and encoded as queryable rules.", agent:{role:"Protocol Agent",desc:"Encodes criteria as rules."}, human:{role:"Clinical Scientist",desc:"Validates interpretation."}, metric:"Criteria coverage"},
      {key:"dots",       name:"Cohort Discovery",    what:"Candidate patients identified across the EHR estate using structured and unstructured criteria.", agent:{role:"Cohort Agent",desc:"Runs criteria across the EHR."}, human:null, metric:"Cohort size"},
      {key:"sieve",      name:"Patient Screening",   what:"Chart-level screening against nuanced criteria, reading free-text notes for exclusions.", agent:{role:"Screening Agent",desc:"Reads notes for exclusions."}, human:{role:"Coordinator",desc:"Resolves ambiguity."}, metric:"Screen-fail rate"},
      {key:"venn",       name:"Eligibility Match",   what:"Confirmed matches ranked by clinical fit and site capacity.", agent:{role:"Matching Agent",desc:"Ranks candidates."}, human:{role:"PI",desc:"Approves shortlist."}, metric:"Match precision"},
      {key:"signal",     name:"Patient Outreach",    what:"Approach patients through their treating provider with consent-appropriate messaging.", agent:{role:"Outreach Agent",desc:"Drafts outreach."}, human:{role:"Physician",desc:"Endorses outreach."}, metric:"Response rate"},
      {key:"badge",      name:"Enrollment",          what:"Consented patients enrolled, scheduled, and tracked for retention.", agent:{role:"Enrollment Agent",desc:"Books visits, tracks retention."}, human:{role:"Coordinator",desc:"Owns consent."}, metric:"Time to first visit"}
    ]
  },
  {
    name:"Prior Authorization",
    stages:[
      {key:"card",       name:"Eligibility Check",   what:"Coverage and benefits verified for the requested service via payer APIs.", agent:{role:"Eligibility Agent",desc:"Queries payer APIs."}, human:null, metric:"Verification accuracy"},
      {key:"policy",     name:"Requirement ID",      what:"Payer policy rules identified for the specific procedure.", agent:{role:"Policy Agent",desc:"Interprets payer policy."}, human:null, metric:"Policy fit"},
      {key:"folder",     name:"Evidence Retrieval",  what:"Clinical records assembled to support medical necessity: chart notes, labs, imaging.", agent:{role:"Evidence Agent",desc:"Pulls chart, labs, imaging."}, human:null, metric:"Evidence completeness"},
      {key:"packet",     name:"Auth Assembly",       what:"Auth request compiled in payer-required format with cited evidence.", agent:{role:"Assembly Agent",desc:"Composes with citations."}, human:{role:"Auth Specialist",desc:"Spot-checks packets."}, metric:"First-pass approval"},
      {key:"portal",     name:"Submission",          what:"Auth submitted through the payer portal via automated handoff.", agent:{role:"Submission Agent",desc:"Portal automation."}, human:null, metric:"Latency"},
      {key:"gauge",      name:"Status Monitoring",   what:"Auth status tracked to decision with stalls surfaced for intervention.", agent:{role:"Monitoring Agent",desc:"Polls and surfaces stalls."}, human:{role:"Specialist",desc:"Intervenes on delays."}, metric:"Turnaround"},
      {key:"stairs",     name:"Escalation",          what:"Peer-to-peer reviews and appeals handled with pre-drafted briefs.", agent:{role:"Escalation Agent",desc:"Prepares briefs."}, human:{role:"Physician",desc:"Runs peer-to-peer."}, metric:"Overturn rate"}
    ]
  }
];

let currentProc=0, currentStage=0;

/* -------- Isometric geometric shape library --------
   Each returns SVG contents on a 200x200 viewBox.
   Style: thin light lines, dashed guides, subtle fills — Distyl weave feel.
   Colors take (stroke, dashed, fill, accent). */
function shapeSvg(key, palette){
  const S = palette; // {stroke, dashed, fill, accent, glow}
  const st = S.stroke, ds = S.dashed, fl = S.fill, ac = S.accent;
  const dash = `stroke-dasharray="2 3"`;
  const thin = `stroke="${st}" stroke-width="1" fill="none"`;
  const thick = `stroke="${st}" stroke-width="1.4" fill="none"`;
  const guide = `stroke="${ds}" stroke-width="0.8" fill="none" ${dash}`;
  const filled = `fill="${fl}" stroke="${st}" stroke-width="1.2"`;
  const accent = `fill="${ac}" stroke="${ac}"`;

  switch(key){
    // Image Acquisition — camera lens (nested rings + aperture)
    case "lens": return `
      <circle cx="100" cy="100" r="78" ${guide}/>
      <circle cx="100" cy="100" r="58" ${thin}/>
      <circle cx="100" cy="100" r="40" ${thick}/>
      <circle cx="100" cy="100" r="22" ${filled}/>
      <circle cx="100" cy="100" r="6" ${accent}/>
      ${[0,60,120,180,240,300].map(a=>{
        const r1=40, r2=58, rad=a*Math.PI/180;
        return `<line x1="${100+Math.cos(rad)*r1}" y1="${100+Math.sin(rad)*r1}" x2="${100+Math.cos(rad)*r2}" y2="${100+Math.sin(rad)*r2}" ${thin}/>`;
      }).join('')}`;

    // Ingestion & Routing — hub with three branches
    case "router": return `
      <circle cx="100" cy="100" r="80" ${guide}/>
      <circle cx="100" cy="100" r="18" ${filled}/>
      <line x1="100" y1="100" x2="40" y2="50" ${thin}/>
      <line x1="100" y1="100" x2="160" y2="50" ${thin}/>
      <line x1="100" y1="100" x2="100" y2="170" ${thin}/>
      <rect x="26" y="36" width="28" height="28" rx="3" ${filled}/>
      <rect x="146" y="36" width="28" height="28" rx="3" ${filled}/>
      <rect x="86" y="156" width="28" height="28" rx="3" ${filled}/>
      <circle cx="100" cy="100" r="4" ${accent}/>`;

    // Preliminary Detection — reticle / target with pinpoint
    case "reticle": return `
      <circle cx="100" cy="100" r="82" ${guide}/>
      <circle cx="100" cy="100" r="60" ${thin}/>
      <circle cx="100" cy="100" r="38" ${thin}/>
      <line x1="10" y1="100" x2="90" y2="100" ${thin}/>
      <line x1="110" y1="100" x2="190" y2="100" ${thin}/>
      <line x1="100" y1="10" x2="100" y2="90" ${thin}/>
      <line x1="100" y1="110" x2="100" y2="190" ${thin}/>
      <circle cx="128" cy="82" r="8" ${accent}/>
      <circle cx="128" cy="82" r="14" ${thin} stroke="${ac}"/>`;

    // Radiologist Review — stacked film sheets (offset)
    case "stack": return `
      <rect x="30" y="30" width="120" height="90" rx="2" ${guide}/>
      <rect x="45" y="50" width="120" height="90" rx="2" ${thin}/>
      <rect x="60" y="70" width="120" height="90" rx="2" ${filled}/>
      <line x1="72" y1="90" x2="168" y2="90" ${thin}/>
      <line x1="72" y1="105" x2="168" y2="105" ${thin}/>
      <line x1="72" y1="120" x2="140" y2="120" ${thin}/>
      <circle cx="120" cy="135" r="10" ${accent} fill="none" stroke-width="1.4"/>
      <circle cx="120" cy="135" r="3" ${accent}/>`;

    // Structured Reporting — clinical report with labelled sections + BI-RADS tag
    case "grid": return `
      <rect x="34" y="22" width="132" height="160" rx="3" ${filled}/>
      <rect x="34" y="22" width="132" height="26" fill="${ac}" fill-opacity="0.14"/>
      <line x1="46" y1="35" x2="96" y2="35" stroke="${ac}" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="46" y1="41" x2="80" y2="41" ${thin}/>
      <text x="120" y="39" font-family="Poppins" font-size="7.5" font-weight="500" fill="${ac}" letter-spacing="1.4">BI-RADS</text>
      <text x="46" y="66" font-family="Poppins" font-size="7" font-weight="500" fill="${st}" letter-spacing="1.6" opacity="0.6">FINDINGS</text>
      <line x1="46" y1="76" x2="152" y2="76" ${thin}/>
      <line x1="46" y1="86" x2="152" y2="86" ${thin}/>
      <line x1="46" y1="96" x2="136" y2="96" ${thin}/>
      <text x="46" y="118" font-family="Poppins" font-size="7" font-weight="500" fill="${st}" letter-spacing="1.6" opacity="0.6">IMPRESSION</text>
      <rect x="46" y="124" width="106" height="20" fill="${ac}" fill-opacity="0.10" rx="2"/>
      <line x1="52" y1="132" x2="140" y2="132" ${thin} stroke="${ac}"/>
      <line x1="52" y1="139" x2="120" y2="139" ${thin} stroke="${ac}"/>
      <text x="46" y="162" font-family="Poppins" font-size="7" font-weight="500" fill="${st}" letter-spacing="1.6" opacity="0.6">RECOMMENDATION</text>
      <line x1="46" y1="171" x2="130" y2="171" ${thin}/>`;

    // Sign-off — stamp / signature seal
    case "seal": return `
      <circle cx="100" cy="100" r="82" ${guide}/>
      <circle cx="100" cy="100" r="58" ${thick}/>
      <circle cx="100" cy="100" r="48" ${thin}/>
      <path d="M 70 100 L 92 122 L 132 82" ${thick} stroke="${ac}" stroke-width="3"/>
      ${[0,45,90,135,180,225,270,315].map(a=>{

/* Palettes for dark (center) and dim (side) slides */
const PAL_DARK      = {stroke:"#dbe9ff", dashed:"rgba(179,208,255,0.32)", fill:"rgba(179,208,255,0.06)", accent:"#7ba9ff", dark:"#02061a"};
const PAL_SIDE_DARK = {stroke:"rgba(255,255,255,0.55)", dashed:"rgba(255,255,255,0.22)", fill:"rgba(255,255,255,0.03)", accent:"rgba(123,169,255,0.65)", dark:"#0e1636"};
const PAL_SIDE_LITE = {stroke:"#54555a", dashed:"rgba(84,86,92,0.35)", fill:"rgba(84,86,92,0.04)", accent:"#0064ff", dark:"#f2f7ff"};
function sidePalette(){
  return document.documentElement.getAttribute("data-theme")==="light" ? PAL_SIDE_LITE : PAL_SIDE_DARK;
}

/* Lucide icons per process — inline SVGs */
const PROC_ICONS = [
  // Medical Imaging — scan icon (frame corners)
  `<svg class="p-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>`,
  // Clinical Documentation — stethoscope
  `<svg class="p-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2v2"/><path d="M5 2v2"/><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/><path d="M8 15a6 6 0 0 0 12 0v-3"/><circle cx="20" cy="10" r="2"/></svg>`,
  // Clinical Trial Recruitment — flask-conical
  `<svg class="p-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.31"/><path d="M14 9.3V1.99"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/><path d="M5.52 16h12.96"/></svg>`,
  // Prior Authorization — shield-check
  `<svg class="p-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>`
];

function slideMarkup(stage, idx){
  const num = String(idx+1).padStart(2,'0');
  const sidePal = sidePalette();
  return `
    <div class="slide" data-idx="${idx}">
      <div class="stage-tag">Stage ${num}</div>
      <svg class="svg-side"   viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet">${shapeSvg(stage.key, sidePal)}</svg>
      <svg class="svg-center" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet">${shapeSvg(stage.key, PAL_DARK)}</svg>
      <div class="stage-name">${stage.name}</div>
    </div>`;
}

function renderTabs(){
  document.getElementById('pTabs').innerHTML = PROCESSES.map((p,i)=>
    `<button class="p-tab ${i===currentProc?'active':''}" data-p="${i}">${p.name}</button>`
  ).join('');
  document.querySelectorAll('.p-tab').forEach(el=>el.addEventListener('click',()=>{
    currentProc = parseInt(el.dataset.p,10); currentStage = 0; renderAll();
  }));
}

function renderCarousel(){
  const stages = PROCESSES[currentProc].stages;
  const track = document.getElementById('carTrack');
  const theme = document.documentElement.getAttribute('data-theme') || 'dark';
  const sig = `${currentProc}-${theme}`;
  if(track.dataset.sig !== sig){
    track.dataset.sig = sig;
    track.innerHTML = stages.map((s,i)=>slideMarkup(s,i)).join('');
    track.querySelectorAll('.slide').forEach(el=>el.addEventListener('click',()=>{
      const idx = parseInt(el.dataset.idx,10);
      if(idx !== currentStage){ currentStage = idx; updatePositions(); renderText(); }
    }));
  }
  updatePositions();
}

function updatePositions(){
  const track = document.getElementById('carTrack');
  const n = PROCESSES[currentProc].stages.length;
  const step = 360 / n;
  const radius = Math.max(420, Math.round(170 / Math.tan(Math.PI/n)));
  track.querySelectorAll('.slide').forEach((el,i)=>{
    el.style.transform = `rotateY(${i*step}deg) translateZ(${radius}px)`;
    el.classList.toggle('pos-center', i===currentStage);
  });
  track.style.transform = `rotateY(${-currentStage*step}deg)`;
}

function renderText(){
  const p = PROCESSES[currentProc];
  const s = p.stages[currentStage];
  const mode = s.human ? 'handoff' : 'autonomous';
  const modeLabel = s.human ? 'Human hand-off' : 'Autonomous';
  document.getElementById('tbLeft').innerHTML = `
    <div class="tc-meta">
      <div class="tc-num">Stage ${String(currentStage+1).padStart(2,'0')} of ${String(p.stages.length).padStart(2,'0')}</div>
      <div class="tc-mode ${mode}">${modeLabel}</div>
    </div>
    <div class="tc-name">${s.name}</div>
    <div class="tc-what">${s.what}</div>
  `;
  const agentFact = s.agent
    ? `<div class="tc-fact agent"><div class="lbl">Agent</div><div class="val">${s.agent.role}<div class="desc">${s.agent.desc}</div></div></div>`
    : `<div class="tc-fact agent none"><div class="lbl">Agent</div><div class="val">Human-owned stage</div></div>`;
  const humanFact = s.human
    ? `<div class="tc-fact human"><div class="lbl">Human</div><div class="val">${s.human.role}<div class="desc">${s.human.desc}</div></div></div>`
    : `<div class="tc-fact human none"><div class="lbl">Human</div><div class="val">Autonomous</div></div>`;
  document.getElementById('tbRight').innerHTML =
    agentFact + humanFact +
    `<div class="tc-fact metric"><div class="lbl">Metric</div><div class="val">${s.metric}</div></div>`;
}

function renderAll(){renderTabs(); renderCarousel(); renderText();}
renderAll();

/* Arrow controls */
function step(dir){
  const n = PROCESSES[currentProc].stages.length;
  currentStage = (currentStage + dir + n) % n;
  updatePositions(); renderText();
}
document.getElementById('carPrev').addEventListener('click', ()=>step(-1));
document.getElementById('carNext').addEventListener('click', ()=>step(1));

/* Theme toggle */
function applyTheme(mode){
  if(mode==="light"){document.documentElement.setAttribute("data-theme","light");}
  else{document.documentElement.removeAttribute("data-theme");}
  document.getElementById("tLight").classList.toggle("on", mode==="light");
  document.getElementById("tDark").classList.toggle("on", mode!=="light");
  try{localStorage.setItem("hls-v8-theme", mode);}catch(e){}
  if(document.getElementById("carTrack")) renderCarousel();
}
let saved="dark";
try{saved=localStorage.getItem("hls-v8-theme")||"dark";}catch(e){}
applyTheme(saved);
document.getElementById("tLight").addEventListener("click",()=>applyTheme("light"));
document.getElementById("tDark").addEventListener("click",()=>applyTheme("dark"));
</script>
