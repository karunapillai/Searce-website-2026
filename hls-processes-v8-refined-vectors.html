<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V8 · Refined Vectors · HLS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d1d1f;--ink-80:rgba(29,29,31,0.86);--ink-60:rgba(29,29,31,0.60);--ink-40:rgba(29,29,31,0.42);--ink-20:rgba(29,29,31,0.14);
  --paper:#f5f5f7;--paper-2:#fff;--line:rgba(0,0,0,0.08);
  --blue:#0064ff;--blue-strong:#004ecc;--blue-06:rgba(0,100,255,0.08);--blue-12:rgba(0,100,255,0.16);--blue-24:rgba(0,100,255,0.24);
  --yellow:#ffb414;--yellow-ink:#8a5a10;
  --green:#0a8b5c;--purple:#734bff;
  --display:'Poppins',system-ui,sans-serif;--body:system-ui,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.55;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;background:none;border:none;cursor:pointer;color:inherit;}
.wrap{max-width:1360px;margin:0 auto;padding:0 40px;}

.crumb{background:#fff;border-bottom:1px solid var(--line);padding:16px 0;font-size:13px;color:var(--ink-60);}
.crumb a{color:var(--blue);}
.crumb strong{color:var(--ink);font-weight:500;margin-left:8px;}

.section{padding:72px 0 96px;background:var(--paper);position:relative;}
.section::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right, rgba(29,29,31,0.025) 1px, transparent 1px),linear-gradient(to bottom, rgba(29,29,31,0.025) 1px, transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse 85% 75% at 50% 50%, #000 55%, transparent 100%);-webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 50%, #000 55%, transparent 100%);}
.section .wrap{position:relative;z-index:1;}

/* Process picker — Apple-style pills in one container, centered */
.p-tabs-wrap{display:flex;justify-content:center;margin-bottom:44px;}
.p-tabs{display:inline-flex;gap:2px;background:#e8e8ed;padding:5px;border-radius:999px;flex-wrap:wrap;justify-content:center;}
.p-tab{padding:10px 22px;font-family:var(--display);font-weight:500;font-size:14px;color:var(--ink-80);border-radius:999px;transition:all .18s;white-space:nowrap;letter-spacing:-0.005em;}
.p-tab:hover{color:var(--ink);}
.p-tab.active{background:var(--ink);color:#fff;}

/* Carousel of stage cards — vector only inside white card, body sits on grey */
.carousel-wrap{position:relative;}
.carousel-track{display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding-bottom:8px;scrollbar-width:none;}
.carousel-track::-webkit-scrollbar{display:none;}
.stage-card{flex:0 0 410px;background:transparent;padding:0;scroll-snap-align:start;display:flex;flex-direction:column;gap:22px;}

.card-vector{aspect-ratio:1/0.95;background:#fff;border-radius:22px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:32px;transition:box-shadow .2s;}
.stage-card:hover .card-vector{box-shadow:0 24px 44px rgba(0,0,0,0.06);}
.card-vector .card-mode{position:absolute;top:20px;right:20px;font-family:var(--display);font-weight:500;font-size:10px;letter-spacing:.18em;text-transform:uppercase;padding:5px 12px;border-radius:999px;z-index:2;}
.card-vector .card-mode.autonomous{background:var(--blue-06);color:var(--blue-strong);}
.card-vector .card-mode.handoff{background:#fff3cd;color:var(--yellow-ink);}
.card-vector .card-num{position:absolute;top:20px;left:20px;font-family:var(--display);font-weight:500;font-size:11px;letter-spacing:.22em;color:var(--ink-40);text-transform:uppercase;z-index:2;}
.card-vector svg{width:100%;height:100%;display:block;}
.card-vector svg text{font-family:Poppins,system-ui,sans-serif;}

/* Card body — sits directly on grey ground, no card wrapper.
   Fixed body height + facts pushed to bottom = divider line aligns across all cards. */
.card-body{padding:0 4px;display:flex;flex-direction:column;gap:12px;min-height:230px;}
.card-body .card-name{font-family:var(--display);font-weight:500;font-size:24px;line-height:1.15;letter-spacing:-0.02em;color:var(--ink);min-height:56px;}
.card-body .card-what{color:var(--ink-60);font-size:14.5px;line-height:1.55;min-height:68px;}
.card-facts{margin-top:auto;padding-top:14px;border-top:1px solid var(--ink-20);display:flex;flex-direction:column;gap:8px;}
.card-facts .fact{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:baseline;font-family:var(--display);}
.card-facts .fact .lbl{font-weight:500;font-size:10px;letter-spacing:.18em;text-transform:uppercase;}
.card-facts .fact.agent .lbl{color:var(--blue);}
.card-facts .fact.human .lbl{color:var(--yellow-ink);}
.card-facts .fact.metric .lbl{color:var(--green);}
.card-facts .fact .v{color:var(--ink);font-weight:500;font-size:13px;letter-spacing:-0.005em;}
.card-facts .fact.none .v{color:var(--ink-40);font-weight:400;}

/* Draw-in animation on scene SVGs */
.card-vector svg .draw{stroke-dasharray:600;stroke-dashoffset:600;animation:drawIn 0.8s cubic-bezier(0.4,0,0.2,1) forwards;}
.card-vector svg .fade{opacity:0;animation:fadeIn 0.5s cubic-bezier(0.4,0,0.2,1) forwards;}
@keyframes drawIn{to{stroke-dashoffset:0;}}
@keyframes fadeIn{to{opacity:1;}}

/* Carousel controls (bottom-right arrows) */
.carousel-controls{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:24px;}
.carousel-progress{flex:1;max-width:180px;height:3px;background:rgba(29,29,31,0.10);border-radius:2px;overflow:hidden;margin-right:8px;}
.carousel-progress-fill{height:100%;background:var(--ink);width:25%;transition:width .3s ease;border-radius:2px;}
.carousel-btn{width:44px;height:44px;border-radius:50%;background:#e8e8ed;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .18s;color:var(--ink);}
.carousel-btn:hover:not(:disabled){background:var(--ink);color:#fff;}
.carousel-btn:disabled{opacity:.4;cursor:not-allowed;}
.carousel-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}

@media (max-width:560px){
  .p-tab{padding:9px 14px;font-size:13px;}
  .stage-card{flex:0 0 285px;}
  .card-body .card-name{font-size:22px;}
}
</style>
</head>
<body>

<div class="crumb"><div class="wrap"><a href="hls-processes-storyboard.html">← Storyboard</a> <strong>Variation 08 · Refined Vectors</strong></div></div>

<section class="section">
  <div class="wrap">
    <div class="p-tabs-wrap"><div class="p-tabs" id="pTabs"></div></div>

    <div class="carousel-wrap">
      <div class="carousel-track" id="carTrack"></div>
      <div class="carousel-controls">
        <div class="carousel-progress"><div class="carousel-progress-fill" id="carProgress"></div></div>
        <button class="carousel-btn" id="carPrev" aria-label="Previous"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg></button>
        <button class="carousel-btn" id="carNext" aria-label="Next"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
      </div>
    </div>
  </div>
</section>

<script>
const PROCESSES = [
  {
    name:"Medical Imaging & Diagnostic Analysis",
    stages:[
      {name:"Image Acquisition",hint:"Study captured on the modality.",what:"Study captured on the modality with the protocol matched to the clinical order and image quality verified before release.",agent:{role:"Protocol Agent",desc:"Verifies protocol and image quality."},human:{role:"Technologist",desc:"Runs the scan, repositions on flags."},metric:"Repeat scan rate"},
      {name:"Ingestion & Routing",hint:"DICOM routed to the right worklist.",what:"DICOM series ingested to PACS and routed to the correct radiologist worklist by modality, urgency, and subspecialty.",agent:{role:"Routing Agent",desc:"Routes by modality, urgency, subspecialty."},human:null,metric:"Ingestion latency"},
      {name:"Preliminary Detection",hint:"AI reads before the radiologist opens the study.",what:"AI reads the study for anomalies and prioritises the worklist before the radiologist opens it.",agent:{role:"Detection Agent",desc:"Flags nodules, hemorrhage, fractures, embolism."},human:null,metric:"Priority triage accuracy"},
      {name:"Radiologist Review",hint:"Radiologist interprets with priors at hand.",what:"Radiologist opens the study, confirms or overrides AI findings, with prior studies and side-by-side measurements surfaced automatically.",agent:{role:"Comparison Agent",desc:"Surfaces priors and measurements."},human:{role:"Radiologist",desc:"Owns interpretation."},metric:"Read turnaround"},
      {name:"Structured Reporting",hint:"Draft report composed from dictation.",what:"Draft report composed with findings, impression, and recommendations, formatted with lexicons like BI-RADS and Lung-RADS.",agent:{role:"Reporting Agent",desc:"Drafts structured report from dictation."},human:null,metric:"Report completeness"},
      {name:"Sign-off",hint:"Radiologist signs the final report.",what:"Radiologist reviews the draft and signs the final report. Sign-off remains human by policy.",agent:null,human:{role:"Radiologist",desc:"Signs the final report."},metric:"Sign-off time"},
      {name:"Critical Findings Communication",hint:"Urgent findings tracked to acknowledgment.",what:"Urgent findings escalated to the ordering clinician and tracked to acknowledgment, with automated pager routing and escalation on delay.",agent:{role:"Notification Agent",desc:"Pages, tracks acknowledgment, escalates on delay."},human:{role:"Radiologist",desc:"Confirms the critical finding call."},metric:"Time to communication"}
    ]
  },
  {
    name:"Clinical Documentation",
    stages:[
      {name:"Patient Encounter",hint:"Ambient capture of the visit.",what:"Ambient capture of the clinician-patient conversation with on-device speaker separation.",agent:{role:"Capture Agent",desc:"On-device audio capture."},human:{role:"Clinician",desc:"Conducts the encounter."},metric:"Capture fidelity"},
      {name:"Clinical Extraction",hint:"Structured entities extracted.",what:"Symptoms, medications, and orders extracted from the transcript and linked to problem lists.",agent:{role:"Extraction Agent",desc:"Structures clinical entities."},human:null,metric:"Recall"},
      {name:"Note Generation",hint:"Draft SOAP note composed.",what:"Draft SOAP note assembled in specialty-appropriate format, composed in the physician's voice.",agent:{role:"Scribe Agent",desc:"Composes the draft note."},human:null,metric:"Draft usability"},
      {name:"EHR Update",hint:"Note pushed to EHR via FHIR.",what:"Note pushed to the EHR with orders, ICD-10, and CPT codes attached.",agent:{role:"EHR Agent",desc:"Writes to the EHR via FHIR."},human:null,metric:"Post-visit lag"},
      {name:"Physician Sign-off",hint:"Physician signs the final note.",what:"Physician reviews, edits, and signs the final note. Sign-off remains human by policy.",agent:null,human:{role:"Physician",desc:"Owns the final note."},metric:"Sign-off time"}
    ]
  },
  {
    name:"Clinical Trial Recruitment",
    stages:[
      {name:"Protocol Ingestion",hint:"Criteria encoded as queryable rules.",what:"Trial protocol parsed for inclusion and exclusion criteria and encoded as queryable rules.",agent:{role:"Protocol Agent",desc:"Encodes criteria as rules."},human:{role:"Clinical Scientist",desc:"Validates interpretation."},metric:"Criteria coverage"},
      {name:"Cohort Discovery",hint:"Candidates identified across EHR.",what:"Candidate patients identified across the EHR estate using structured and unstructured criteria.",agent:{role:"Cohort Agent",desc:"Runs criteria across the EHR."},human:null,metric:"Cohort size"},
      {name:"Patient Screening",hint:"Chart-level pre-screening.",what:"Chart-level screening against nuanced criteria, reading free-text notes for exclusions.",agent:{role:"Screening Agent",desc:"Reads notes for exclusions."},human:{role:"Study Coordinator",desc:"Resolves ambiguity."},metric:"Screen-fail rate"},
      {name:"Eligibility Match",hint:"Ranked by fit and site capacity.",what:"Confirmed matches ranked by clinical fit and site capacity.",agent:{role:"Matching Agent",desc:"Ranks candidates."},human:{role:"Principal Investigator",desc:"Approves shortlist."},metric:"Match precision"},
      {name:"Patient Outreach",hint:"Approach through the provider.",what:"Approach patients through their treating provider with consent-appropriate messaging.",agent:{role:"Outreach Agent",desc:"Drafts outreach."},human:{role:"Physician",desc:"Endorses outreach."},metric:"Response rate"},
      {name:"Enrollment",hint:"Enrolled, consented, scheduled.",what:"Consented patients enrolled, scheduled, and tracked for retention.",agent:{role:"Enrollment Agent",desc:"Books visits, tracks retention."},human:{role:"Study Coordinator",desc:"Owns consent."},metric:"Time to first visit"}
    ]
  },
  {
    name:"Prior Authorization",
    stages:[
      {name:"Eligibility Verification",hint:"Coverage verified.",what:"Coverage and benefits verified for the requested service by querying payer APIs.",agent:{role:"Eligibility Agent",desc:"Queries payer APIs."},human:null,metric:"Verification accuracy"},
      {name:"Requirement Identification",hint:"Payer policy rules identified.",what:"Payer policy rules identified for the specific procedure.",agent:{role:"Policy Agent",desc:"Interprets payer policy."},human:null,metric:"Policy fit"},
      {name:"Evidence Retrieval",hint:"Chart notes, labs, imaging assembled.",what:"Clinical records assembled to support medical necessity: chart notes, labs, imaging.",agent:{role:"Evidence Agent",desc:"Pulls chart, labs, imaging."},human:null,metric:"Evidence completeness"},
      {name:"Auth Assembly",hint:"Auth packet composed with citations.",what:"Auth request compiled in payer-required format with cited evidence.",agent:{role:"Assembly Agent",desc:"Composes with citations."},human:{role:"Auth Specialist",desc:"Spot-checks packets."},metric:"First-pass approval"},
      {name:"Payer Submission",hint:"Submitted through the portal.",what:"Auth submitted through the payer portal via automated handoff.",agent:{role:"Submission Agent",desc:"Portal automation."},human:null,metric:"Latency"},
      {name:"Status Monitoring",hint:"Tracked to decision.",what:"Auth status tracked to decision with stalls surfaced for intervention.",agent:{role:"Monitoring Agent",desc:"Polls and surfaces stalls."},human:{role:"Specialist",desc:"Intervenes on delays."},metric:"Turnaround"},
      {name:"Escalation",hint:"Peer-to-peer and appeals.",what:"Peer-to-peer reviews and appeals handled with pre-drafted briefs.",agent:{role:"Escalation Agent",desc:"Prepares briefs."},human:{role:"Physician",desc:"Runs peer-to-peer."},metric:"Overturn rate"}
    ]
  }
];

let currentProc=0, currentStage=0;

/* Lucide icons per process */
const PROC_ICONS = [
  // Medical Imaging — scan
  `<svg class="p-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>`,
  // Clinical Documentation — stethoscope
  `<svg class="p-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2v2"/><path d="M5 2v2"/><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/><path d="M8 15a6 6 0 0 0 12 0v-3"/><circle cx="20" cy="10" r="2"/></svg>`,
  // Clinical Trial Recruitment — flask-conical
  `<svg class="p-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.31"/><path d="M14 9.3V1.99"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/><path d="M5.52 16h12.96"/></svg>`,
  // Prior Authorization — shield-check
  `<svg class="p-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>`
];

function renderTabs(){
  document.getElementById('pTabs').innerHTML = PROCESSES.map((p,i)=>
    `<button class="p-tab ${i===currentProc?'active':''}" data-p="${i}">${p.name}</button>`
  ).join('');
  document.querySelectorAll('.p-tab').forEach(el=>el.addEventListener('click',()=>{
    currentProc = parseInt(el.dataset.p,10); currentStage = 0; renderAll();
  }));
}

function renderCards(){
  const p = PROCESSES[currentProc];
  const scenes = SCENES_BY_PROC[currentProc] || MI;
  document.getElementById('carTrack').innerHTML = p.stages.map((s,i)=>{
    const scene = scenes[i] || scenes[0];
    const num = String(i+1).padStart(2,'0');
    const mode = s.human ? 'handoff' : 'autonomous';
    const modeLabel = s.human ? 'Human hand-off' : 'Autonomous';
    const agentFact = s.agent
      ? `<div class="fact agent"><span class="lbl">Agent</span><span class="v">${s.agent.role}</span></div>`
      : `<div class="fact agent none"><span class="lbl">Agent</span><span class="v">Human-owned</span></div>`;
    const humanFact = s.human
      ? `<div class="fact human"><span class="lbl">Human</span><span class="v">${s.human.role}</span></div>`
      : `<div class="fact human none"><span class="lbl">Human</span><span class="v">Autonomous</span></div>`;
    return `<article class="stage-card" data-idx="${i}">
      <div class="card-vector">
        <div class="card-num">Stage ${num}</div>
        <div class="card-mode ${mode}">${modeLabel}</div>
        ${scene()}
      </div>
      <div class="card-body">
        <div class="card-name">${s.name}</div>
        <div class="card-what">${s.what || s.hint || ''}</div>
        <div class="card-facts">
          ${agentFact}
          ${humanFact}
          <div class="fact metric"><span class="lbl">Metric</span><span class="v">${s.metric}</span></div>
        </div>
      </div>
    </article>`;
  }).join('');
  updateProgress();
}

/* Carousel scroll behaviour */
function cardStep(){
  const track = document.getElementById('carTrack');
  const first = track.querySelector('.stage-card');
  if (!first) return 340;
  return first.getBoundingClientRect().width + 20;
}
function updateProgress(){
  const track = document.getElementById('carTrack');
  const max = track.scrollWidth - track.clientWidth;
  const pct = max > 0 ? (track.scrollLeft / max) * 100 : 100;
  document.getElementById('carProgress').style.width = Math.max(15, pct) + '%';
  document.getElementById('carPrev').disabled = track.scrollLeft <= 4;
  document.getElementById('carNext').disabled = track.scrollLeft >= max - 4;
}
document.getElementById('carPrev').addEventListener('click', ()=>{
  document.getElementById('carTrack').scrollBy({left: -cardStep(), behavior:'smooth'});
});
document.getElementById('carNext').addEventListener('click', ()=>{
  document.getElementById('carTrack').scrollBy({left: cardStep(), behavior:'smooth'});
});
document.getElementById('carTrack').addEventListener('scroll', updateProgress, {passive:true});
window.addEventListener('resize', updateProgress);

/* ============================================================================
   UI-MOCKUP VECTOR LANGUAGE
   Soft-shadowed cards · blue brand tile · labeled chips · dashed connections.
   Every stage: one clear concept, expressed as a mini enterprise product graphic.
   ============================================================================ */
const S = 'rgba(29,29,31,0.72)';
const F = '#1d1d1f';
const B = '#0064ff';
const B_LIGHT = 'rgba(0,100,255,0.18)';
const B_TINT = 'rgba(0,100,255,0.06)';
const Y = '#ffb414';
const G = '#0a8b5c';
const DOT = 'rgba(29,29,31,0.28)';
const DIM = 'rgba(29,29,31,0.10)';
const BORDER = 'rgba(0,0,0,0.08)';
const SHADOW = 'rgba(29,29,31,0.06)';

const open = () => `<svg viewBox="0 0 400 380" preserveAspectRatio="xMidYMid meet">`;
const close = `</svg>`;

/* Primitives */
const d = (x,y,r,fill,dl,cls='fade') =>
  `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" opacity="0" class="${cls}" style="animation-delay:${dl}s"/>`;
const ring = (x,y,r,dl,{sw=1.5,stroke=S,op=1,fill='none'}={}) =>
  `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" opacity="${op}" class="draw" style="animation-delay:${dl}s"/>`;
const ln = (x1,y1,x2,y2,dl,{stroke=S,sw=1,dash='',op=1}={}) =>
  `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${sw}" stroke-dasharray="${dash}" opacity="${op}" class="draw" style="animation-delay:${dl}s"/>`;
const rct = (x,y,w,h,dl,{stroke=S,sw=1.2,fill='none',op=1,rx=0}={}) =>
  `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" opacity="${op}" class="draw" style="animation-delay:${dl}s"/>`;
const pth = (dstr,dl,{stroke=S,sw=1.5,fill='none',op=1,cls='draw'}={}) =>
  `<path d="${dstr}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" opacity="${op}" class="${cls}" style="animation-delay:${dl}s"/>`;
const txt = (x,y,text,dl,{size=10,weight=500,fill=F,anchor='start',letter='0'}={}) =>
  `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${size}" font-weight="${weight}" fill="${fill}" letter-spacing="${letter}" opacity="0" class="fade" style="animation-delay:${dl}s">${text}</text>`;

/* UI helpers */
// Soft-shadowed floating card
const card = (x,y,w,h,dl,{rx=10,fill='#fff'}={}) =>
  `<rect x="${x+2}" y="${y+5}" width="${w}" height="${h}" rx="${rx}" fill="${SHADOW}" opacity="0" class="fade" style="animation-delay:${dl}s"/>` +
  `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${BORDER}" stroke-width="1" opacity="0" class="fade" style="animation-delay:${dl}s"/>`;

// Blue brand tile with glow-shadow + sparkle
const brandTile = (x,y,size,dl,{icon='sparkle'}={}) => {
  const cx=x+size/2, cy=y+size/2;
  let out = `<rect x="${x-4}" y="${y+7}" width="${size+8}" height="${size}" rx="16" fill="${B_LIGHT}" opacity="0" class="fade" style="animation-delay:${dl}s"/>` +
    `<rect x="${x}" y="${y}" width="${size}" height="${size}" rx="14" fill="${B}" opacity="0" class="fade" style="animation-delay:${dl}s"/>`;
  if (icon==='sparkle') {
    const s = size*0.28;
    out += `<path d="M ${cx} ${cy-s} L ${cx+s*0.32} ${cy-s*0.32} L ${cx+s} ${cy} L ${cx+s*0.32} ${cy+s*0.32} L ${cx} ${cy+s} L ${cx-s*0.32} ${cy+s*0.32} L ${cx-s} ${cy} L ${cx-s*0.32} ${cy-s*0.32} Z" fill="#fff" opacity="0" class="fade" style="animation-delay:${dl+0.15}s"/>`;
  } else if (icon==='people') {
    out += `<circle cx="${cx-6}" cy="${cy-4}" r="4" fill="none" stroke="#fff" stroke-width="1.5" opacity="0" class="fade" style="animation-delay:${dl+0.15}s"/>` +
      `<circle cx="${cx+6}" cy="${cy-4}" r="4" fill="none" stroke="#fff" stroke-width="1.5" opacity="0" class="fade" style="animation-delay:${dl+0.17}s"/>` +
      `<path d="M ${cx-12} ${cy+8} Q ${cx-12} ${cy+2} ${cx-6} ${cy+2} Q ${cx} ${cy+2} ${cx} ${cy+8} Q ${cx} ${cy+2} ${cx+6} ${cy+2} Q ${cx+12} ${cy+2} ${cx+12} ${cy+8}" fill="none" stroke="#fff" stroke-width="1.5" opacity="0" class="fade" style="animation-delay:${dl+0.2}s"/>`;
  } else if (icon==='bell') {

// Labeled chip pill (rounded rect w/ dot + text)
const chip = (x,y,w,h,text,dl,{dot=true,dotColor=B,textSize=9}={}) => {
  const r = h/2;
  let out = `<rect x="${x+1}" y="${y+2}" width="${w}" height="${h}" rx="${r}" fill="${SHADOW}" opacity="0" class="fade" style="animation-delay:${dl}s"/>` +
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="#fff" stroke="${BORDER}" stroke-width="1" opacity="0" class="fade" style="animation-delay:${dl}s"/>`;
  if (dot) out += `<circle cx="${x+r+1}" cy="${y+r}" r="3" fill="${dotColor}" opacity="0" class="fade" style="animation-delay:${dl+0.05}s"/>`;
  const textX = dot ? x + r + 9 : x + 12;
  out += `<text x="${textX}" y="${y+r+3}" font-size="${textSize}" fill="${F}" font-weight="500" opacity="0" class="fade" style="animation-delay:${dl+0.1}s">${text}</text>`;

};
